<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSIC Kiosk Fleet Status</title>
<style>
  :root {
    --bg: #f5f6f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: #e2e2e2;
    --online: #16a34a;
    --offline: #dc2626;
    --stale: #d97706;
    --accent: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #171d2c;
      --text: #e7e9ee;
      --text-secondary: #9aa3b2;
      --border: #2a3244;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0; }
  .summary { color: var(--text-secondary); font-size: 14px; }
  .summary strong { color: var(--online); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
  }
  th {
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  tr:last-child td { border-bottom: none; }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .dot.online { background: var(--online); }
  .dot.stale { background: var(--stale); }
  .dot.offline { background: var(--offline); }
  .empty {
    text-align: center;
    padding: 48px;
    color: var(--text-secondary);
  }
  .footer {
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
  <header>
    <h1>RSIC Kiosk Fleet Status</h1>
    <div class="summary" id="summary">Loading…</div>
  </header>
  <table id="table" style="display:none">
    <thead>
      <tr>
        <th>Status</th>
        <th>Device</th>
        <th>Model</th>
        <th>Last Seen</th>
        <th>Wi-Fi</th>
        <th>Battery</th>
        <th>Current Page</th>
        <th>App Version</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">
    No devices have checked in yet.
  </div>
  <div class="footer" id="footer"></div>

<script>
const OWNER = "lasanthr";
const REPO = "rsic-kiosk-fleet-status";
const REFRESH_MS = 90000;
const ONLINE_WITHIN_MS = 12 * 60 * 1000;   // report interval is ~5 min; 12 min = missed 2 reports
const STALE_WITHIN_MS = 30 * 60 * 1000;

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const diffSec = Math.round((Date.now() - then) / 1000);
  if (diffSec < 60) return diffSec + "s ago";
  if (diffSec < 3600) return Math.round(diffSec / 60) + "m ago";
  if (diffSec < 86400) return Math.round(diffSec / 3600) + "h ago";
  return Math.round(diffSec / 86400) + "d ago";
}

function statusFor(iso) {
  const age = Date.now() - new Date(iso).getTime();
  if (age < ONLINE_WITHIN_MS) return "online";
  if (age < STALE_WITHIN_MS) return "stale";
  return "offline";
}

async function loadDevices() {
  // Deliberately never hits api.github.com here — that's capped at 60 unauthenticated
  // requests/hour per IP and gets exhausted fast by normal dashboard viewing (it also
  // fails as a confusing CORS error rather than a clear 403, since GitHub omits CORS
  // headers on throttled responses). raw.githubusercontent.com is a CDN, not subject to
  // that limit. Each device maintains devices/index.json so it never needs listing.
  const indexResp = await fetch(
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/devices/index.json?t=${Date.now()}`
  );
  if (!indexResp.ok) {
    if (indexResp.status === 404) return []; // no devices have ever reported yet
    throw new Error("Could not load device index (" + indexResp.status + ")");
  }
  const deviceIds = await indexResp.json();

  const devices = await Promise.all(
    deviceIds.map(async (id) => {
      const raw = await fetch(
        `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/devices/${id}.json?t=${Date.now()}`
      );
      if (!raw.ok) return null;
      try {
        return await raw.json();
      } catch {
        return null;
      }
    })
  );
  return devices.filter(Boolean);
}

function render(devices) {
  const rows = document.getElementById("rows");
  const table = document.getElementById("table");
  const empty = document.getElementById("empty");
  const summary = document.getElementById("summary");

  if (devices.length === 0) {
    table.style.display = "none";
    empty.style.display = "block";
    summary.textContent = "0 devices";
    return;
  }

  devices.sort((a, b) => new Date(b.lastSeenUtc) - new Date(a.lastSeenUtc));

  const onlineCount = devices.filter(d => statusFor(d.lastSeenUtc) === "online").length;
  summary.innerHTML = `<strong>${onlineCount}</strong> / ${devices.length} online`;

  rows.innerHTML = devices.map(d => {
    const status = statusFor(d.lastSeenUtc);
    const battery = (d.batteryPercent ?? d.batteryPercent === 0) ? d.batteryPercent + "%" : "—";
    return `<tr>
      <td><span class="dot ${status}"></span>${status}</td>
      <td>${escapeHtml(d.deviceId ?? "—")}</td>
      <td>${escapeHtml(d.model ?? "—")}</td>
      <td title="${escapeHtml(d.lastSeenUtc ?? "")}">${relativeTime(d.lastSeenUtc)}</td>
      <td>${escapeHtml(d.wifiSsid ?? "—")}</td>
      <td>${battery}</td>
      <td title="${escapeHtml(d.currentUrl ?? "")}">${escapeHtml(d.currentUrl ?? "—")}</td>
      <td>${escapeHtml(d.appVersionName ?? "—")}</td>
    </tr>`;
  }).join("");

  table.style.display = "table";
  empty.style.display = "none";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function tick() {
  try {
    const devices = await loadDevices();
    render(devices);
    document.getElementById("footer").textContent =
      "Updated " + new Date().toLocaleTimeString() + " · refreshes every " + (REFRESH_MS / 1000) + "s";
  } catch (e) {
    document.getElementById("footer").textContent = "Refresh failed: " + e.message;
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
